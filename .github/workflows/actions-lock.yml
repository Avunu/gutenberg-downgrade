name: Actions lock

# Checks that every action the workflows use is pinned in .github/workflows/actions.lock.
# It is a separate workflow on purpose: check.yml is also called from release.yml, and a
# lock failure here must not block a release.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: |
          if ! gh extension list | grep -q 'github/gh-actions-lock'; then
            gh extension install github/gh-actions-lock --pin v0.5.1
          fi

      - name: Verify the lockfile
        run: gh actions-lock --verify
