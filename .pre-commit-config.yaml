# Git hooks, run by prek (https://prek.j178.dev): `uv tool install prek && prek install`.
# They replace the git-hooks.nix hooks of the same names. Each hook is one check, at the
# same stage (pre-commit) and scope as before. `pass_filenames: false` hooks still run over
# the whole project when a matching file is staged.
#
# The TypeScript hooks use node_modules, so run `npm ci` and `npm --prefix tests/playground ci`
# first. The PHP hook runs phpcs from tests/tools/vendor, the locked tools project: install it with
# `composer install --working-dir=tests/tools`. phpstan is not here: the nix build reads
# tests/tools/composer.lock, and phpstan is dist-only, so it cannot be locked there. statix is not
# here either: it is a Rust tool with no composer or npm package, so it stays in the nix dev shell only.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        description: Format staged JavaScript and TypeScript in place.
        entry: ./node_modules/.bin/oxfmt
        language: system
        types_or: [javascript, jsx, ts, tsx]

      - id: oxlint
        name: oxlint
        description: Lint staged JavaScript and TypeScript.
        entry: ./node_modules/.bin/oxlint
        language: system
        types_or: [javascript, jsx, ts, tsx]

      - id: tsc
        name: tsc
        description: TypeScript type-check of the browser shim and the playground harness.
        entry: ./node_modules/.bin/tsc --noEmit
        language: system
        files: '\.(m?ts|js|json)$'
        pass_filenames: false

      - id: tsc-harness
        name: tsc (playground harness)
        description: TypeScript type-check of the playground harness.
        entry: ./node_modules/.bin/tsc --noEmit -p tests/playground/tsconfig.json
        language: system
        files: '^tests/playground/.*\.m?ts$'
        pass_filenames: false

      - id: phpcs-psr12
        name: phpcs
        description: PSR-12 (phpcs.xml.dist).
        entry: tests/tools/vendor/bin/phpcs -q --standard=phpcs.xml.dist
        language: system
        types: [php]
        pass_filenames: false

  - repo: https://github.com/NixOS/nixfmt
    rev: v1.5.0
    hooks:
      - id: nixfmt

  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix
